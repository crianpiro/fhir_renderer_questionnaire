name: Release website

# This repository is a monorepo. The published website is the top-level
# `example/` showcase app, which depends on each package's own example app and
# presents them together. Because the showcase pulls those examples in as path
# dependencies, a change to any package can change the deployed site.

on:
  push:
    branches: [ main ]
    paths:
      - 'example/**'
      - 'fhir_renderer_*/**'
      - '.github/workflows/release_website.yaml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The showcase app at the repository root. `flutter pub get` here also
        # resolves the per-package example apps it depends on by path.
        working-directory: example
    steps:
      - uses: actions/checkout@v2 # Only works with v2
      - uses: subosito/flutter-action@v1
        with:
          flutter-version: 3.29.0
      - name: Install dependencies
        run: flutter pub get

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      
      - name: Build web
        run: flutter build web --release --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4